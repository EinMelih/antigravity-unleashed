# ============================================================
#  Anti-Gravity Hub - Nginx Reverse Proxy Configuration (TLS phase)
#
#  Replace BASE_DOMAIN with the base domain (for example example.com).
#  Replace CERT_NAME with the explicit Certbot certificate name. The deployment
#  guide uses app.BASE_DOMAIN so the certificate path is deterministic.
#  Install this file only after the HTTP ACME bootstrap has issued the cert.
# ============================================================

# --- Rate Limiting ---
limit_req_zone $binary_remote_addr zone=antigravity_limit:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=antigravity_api_limit:10m rate=20r/s;
server_tokens off;

# --- Upstream Definitions ---
upstream proxy_backend {
    server 127.0.0.1:8000;
    keepalive 32;
}

upstream api_backend {
    server 127.0.0.1:8002;
    keepalive 32;
}

upstream monitor_backend {
    server 127.0.0.1:8010;
    keepalive 32;
}

# ============================================================
#  HTTP → HTTPS Redirect (all subdomains)
# ============================================================
server {
    listen 80;
    listen [::]:80;
    server_name app.BASE_DOMAIN api.BASE_DOMAIN monitor.BASE_DOMAIN;

    # Let's Encrypt ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ============================================================
#  app.BASE_DOMAIN → Proxy / Web UI (Port 8000)
# ============================================================
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name app.BASE_DOMAIN;

    # The Hub can read project files and trigger local processes. Never expose
    # it without an authentication boundary in front of the loopback service.
    auth_basic "Anti-Gravity Hub";
    auth_basic_user_file /etc/nginx/antigravity.htpasswd;

    # --- SSL ---
    ssl_certificate     /etc/letsencrypt/live/CERT_NAME/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/CERT_NAME/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # --- Gzip ---
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;
    gzip_min_length 256;
    gzip_vary on;

    # --- Security Headers ---
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # --- Logging ---
    access_log /var/log/nginx/antigravity-app-access.log;
    error_log  /var/log/nginx/antigravity-app-error.log;

    # --- Rate Limiting ---
    limit_req zone=antigravity_limit burst=20 nodelay;

    # Hub attachments are accepted up to the same boundary as the API route.
    client_max_body_size 20M;

    location / {
        proxy_pass http://proxy_backend;

        # Proxy Headers
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Methods;
        proxy_hide_header Access-Control-Allow-Headers;
        proxy_hide_header Access-Control-Max-Age;

        # WebSocket / SSE support
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Timeouts for long-running SSE streams
        proxy_read_timeout    3600s;
        proxy_send_timeout    3600s;
        proxy_connect_timeout 60s;

        # Disable buffering for SSE
        proxy_buffering off;
        proxy_cache off;

    }
}

# ============================================================
#  api.BASE_DOMAIN → Session Manager (Port 8002)
# ============================================================
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.BASE_DOMAIN;

    # --- SSL ---
    ssl_certificate     /etc/letsencrypt/live/CERT_NAME/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/CERT_NAME/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # --- Gzip ---
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;
    gzip_min_length 256;
    gzip_vary on;

    # --- Security Headers ---
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # --- Logging ---
    access_log /var/log/nginx/antigravity-api-access.log;
    error_log  /var/log/nginx/antigravity-api-error.log;

    # --- Rate Limiting ---
    limit_req zone=antigravity_api_limit burst=40 nodelay;

    # Match the Hub attachment boundary for OpenAI-compatible requests.
    client_max_body_size 20M;

    location / {
        proxy_pass http://api_backend;

        # Proxy Headers
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Methods;
        proxy_hide_header Access-Control-Allow-Headers;
        proxy_hide_header Access-Control-Max-Age;

        # WebSocket / SSE support
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Timeouts for long-running SSE streams
        proxy_read_timeout    3600s;
        proxy_send_timeout    3600s;
        proxy_connect_timeout 60s;

        # Disable buffering for SSE
        proxy_buffering off;
        proxy_cache off;

    }
}

# ============================================================
#  monitor.BASE_DOMAIN → Watchdog Status (Port 8010)
# ============================================================
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name monitor.BASE_DOMAIN;

    auth_basic "Anti-Gravity Monitor";
    auth_basic_user_file /etc/nginx/antigravity.htpasswd;

    # --- SSL ---
    ssl_certificate     /etc/letsencrypt/live/CERT_NAME/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/CERT_NAME/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # --- Gzip ---
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;
    gzip_min_length 256;
    gzip_vary on;

    # --- Security Headers ---
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;

    # --- Logging ---
    access_log /var/log/nginx/antigravity-monitor-access.log;
    error_log  /var/log/nginx/antigravity-monitor-error.log;

    # --- Rate Limiting ---
    limit_req zone=antigravity_limit burst=10 nodelay;

    # Optional: Restrict access to monitor by IP
    # allow 192.168.1.0/24;
    # deny all;

    location / {
        proxy_pass http://monitor_backend;

        # Proxy Headers
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Origin            "";

        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Methods;
        proxy_hide_header Access-Control-Allow-Headers;
        proxy_hide_header Access-Control-Max-Age;

        # WebSocket / SSE support
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_read_timeout    300s;
        proxy_send_timeout    300s;
        proxy_connect_timeout 60s;

        proxy_buffering off;
    }
}
